<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ee" />
    <meta name="description" content="Distribution billing and operations management" />
    <title>Ledgerly | Distribution Management</title>
    <style>
      :root {
        color: #17302b;
        background: #f6f4ee;
        font-family: Georgia, "Times New Roman", serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 18%, rgba(220, 164, 79, .2), transparent 28%),
          radial-gradient(circle at 88% 84%, rgba(52, 105, 88, .15), transparent 30%),
          #f6f4ee;
      }
      .boot-panel {
        width: min(100%, 760px);
        padding: clamp(28px, 7vw, 72px);
        border: 1px solid rgba(23, 48, 43, .14);
        background: rgba(255, 254, 249, .72);
        box-shadow: 0 24px 70px rgba(23, 48, 43, .1);
      }
      .boot-mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        color: #fffdf5;
        background: #17302b;
        font: 700 20px Georgia, serif;
      }
      .boot-kicker {
        margin: 34px 0 12px;
        color: #a66a22;
        font: 700 12px/1.2 Arial, sans-serif;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      .boot-title {
        max-width: 620px;
        margin: 0;
        color: #17302b;
        font-size: clamp(38px, 7vw, 76px);
        font-weight: 400;
        line-height: .98;
        letter-spacing: -.04em;
      }
      .boot-copy {
        max-width: 480px;
        margin: 24px 0 0;
        color: #59706a;
        font: 16px/1.6 Arial, sans-serif;
      }
      .boot-status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 40px;
        color: #59706a;
        font: 12px Arial, sans-serif;
        letter-spacing: .04em;
      }
      .boot-spinner {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #d69b48;
        box-shadow: 0 0 0 5px rgba(214, 155, 72, .14);
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      .boot-progress {
        height: 3px;
        width: min(100%, 320px);
        margin-top: 14px;
        overflow: hidden;
        background: rgba(23, 48, 43, .1);
      }
      .boot-progress::after {
        display: block;
        width: 38%;
        height: 100%;
        content: "";
        background: #d69b48;
        animation: boot-progress 1.7s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: .4; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes boot-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner, .boot-progress::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-label="Loading Distribution Management">
        <section class="boot-panel">
          <div class="boot-mark" aria-hidden="true">L</div>
          <p class="boot-kicker">Distribution operations</p>
          <h1 class="boot-title">A clearer way to move business forward.</h1>
          <p class="boot-copy">Billing, stock, collections, and daily decisions in one calm workspace.</p>
          <div class="boot-status"><span class="boot-spinner" aria-hidden="true"></span>Preparing your workspace</div>
          <div class="boot-progress" role="progressbar" aria-label="Loading workspace"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
